x-shutdown-evidence: Last successful Wayback capture of fashionara.com returned HTTP 200 on
  2016-05-06; a capture on 2016-05-28 returned HTTP 503 and every crawl attempt from 2016-06-02
  onward failed. Captures in 2021 show only a bare Apache "Index of /" listing containing cgi-bin,
  i.e. an abandoned server with no application deployed.
x-domain-status: registered-not-resolving
x-domain-note: fashionara.com is still registered (GoDaddy, created 2011-07-18, expiry 2028-07-18,
  last updated 2023-06-24) and is delegated to AWS Route 53 nameservers, but those nameservers
  return REFUSED for the zone — the hosted zone was deleted while the registrar delegation was
  left in place. The domain therefore has no A, MX or TXT records and does not resolve at all, so
  no Website pointer is wired. The subdomains help./blog./m./static.fashionara.com likewise no
  longer resolve.
x-social-note: The company's former social handles cannot be attributed to Fashionara today and
  are deliberately not wired as pointers. facebook.com/ShopFashionara serves an error page;
  pinterest.com/fashionara has been renamed to an unrelated profile ("FDot");
  linkedin.com/company/fashionara is a 13-follower page whose description does not match the
  original premium-curated positioning; instagram.com/fashionaraindia is behind a login wall and
  unverifiable. The Android app com.fnara.main returns HTTP 404 on Google Play (delisted).
