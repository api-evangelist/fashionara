name: Fashionara
description: Fashionara was an Indian premium online fashion retailer that launched in 2012 as a
  curated "e-fashion mall" selling ladies, men's and kids apparel, footwear and lifestyle goods.
  It ran a flash-sale "events" model on a Magento storefront, carried more than 200 international
  labels alongside Indian brands including Kenneth Cole, Calvin Klein, Fossil, Adidas, Benetton,
  Van Heusen, Allen Solly, Clarks and Arrow, and operated a quirky in-house sub-brand called
  F.lea Bazaar. It offered free shipping over Rs. 799, free returns, next-day delivery in eight
  Indian cities, a style-advisor booking service and an Android app (com.fnara.main). The company
  was backed by Lightspeed Venture Partners. Fashionara never published a public API, developer
  portal, SDK or OpenAPI definition — a scan of more than 8,000 archived fashionara.com URLs found
  no /api, /developer, /docs, /swagger, /oauth or /graphql paths, and no api/developer subdomain
  was ever archived. The storefront went dark in mid-2016 and the domain no longer resolves. This
  profile is retained as a historical record; there is no API surface to enrich.
